<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Заброшенный магазин — Часть II</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;
  user-select:none;-webkit-user-select:none;}
#renderer{position:fixed;top:0;left:0;width:100%;height:100%;}

/* ---------- начальный экран ---------- */
#start{position:fixed;inset:0;background:#050506;z-index:300;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#d8d4cc;text-align:center;padding:24px;}
#menubg{position:absolute;inset:0;overflow:hidden;}
#menubg:before{content:'';position:absolute;inset:-10%;
  background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(150,60,40,0.16),rgba(0,0,0,0) 70%),
             radial-gradient(ellipse 80% 70% at 50% 100%,rgba(40,30,60,0.35),rgba(0,0,0,0) 70%);
  animation:mbreath 9s ease-in-out infinite;}
@keyframes mbreath{0%,100%{transform:scale(1);opacity:0.85}50%{transform:scale(1.06);opacity:1}}
#menuwrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
.mbtn{margin-top:14px;min-width:min(72vw,290px);background:rgba(18,18,26,0.9);color:#e4e0d6;
  border:2px solid rgba(255,255,255,0.26);padding:15px 30px;font-family:'Courier New',monospace;
  font-size:15px;letter-spacing:5px;cursor:pointer;transition:all 0.18s;}
.mbtn:hover:not([disabled]){background:#c9a227;color:#101014;border-color:#c9a227;
  box-shadow:0 0 26px rgba(201,162,39,0.4);}
.mbtn[disabled]{opacity:0.32;cursor:default;border-color:rgba(255,255,255,0.12);}
.mbtn.ghost{border-color:rgba(120,200,140,0.4);color:#a8d8b4;}
.mbtn.ghost:hover:not([disabled]){background:#3fa85f;color:#08120a;border-color:#3fa85f;
  box-shadow:0 0 26px rgba(63,168,95,0.4);}
#mnote{margin-top:6px;font-size:10px;letter-spacing:2px;color:#8a7a3a;height:13px;}
#mhint{margin-top:10px;font-size:10px;letter-spacing:2px;color:#5a5560;height:14px;}
.rows{margin-top:26px;}
#choice{display:none;position:fixed;left:50%;bottom:26%;transform:translateX(-50%);
  z-index:34;flex-direction:column;gap:11px;width:min(86vw,520px);opacity:0;
  transition:opacity 0.4s,transform 0.4s;}
#choice.show{opacity:1;}
.chbtn{background:rgba(12,12,18,0.92);color:#e4e0d6;border:2px solid rgba(255,255,255,0.28);
  padding:13px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.4;
  cursor:pointer;text-align:left;transition:all 0.15s;}
.chbtn:hover{background:#c9a227;color:#101014;border-color:#c9a227;}
#savedmsg{position:fixed;left:50%;bottom:20%;transform:translateX(-50%) translateY(14px);
  z-index:33;pointer-events:none;background:rgba(10,10,14,0.88);border-left:3px solid #3fa85f;
  padding:9px 15px;color:#b8d8c0;font-size:11px;letter-spacing:2px;opacity:0;
  transition:opacity 0.45s,transform 0.45s;}
#savedmsg.show{opacity:1;transform:translateX(-50%) translateY(0);}
#bloadlbl{color:#6a8a70;font-size:10px;letter-spacing:2px;margin:6px 0 14px;}
#start h1{font-size:clamp(20px,6vw,34px);letter-spacing:6px;margin-bottom:6px;}
#start .sub{font-size:12px;letter-spacing:4px;color:#6a6570;margin-bottom:28px;}
#start .row{font-size:12px;letter-spacing:1px;color:#8a8590;margin:5px 0;}
#start button{margin-top:26px;background:#12121a;color:#d8d4cc;border:2px solid rgba(255,255,255,0.3);
  padding:16px 40px;font-family:'Courier New',monospace;font-size:15px;letter-spacing:4px;cursor:pointer;}
#start button:hover{background:#d8d4cc;color:#05050a;}

/* ---------- интерфейс ---------- */
#msg{position:fixed;top:14%;left:50%;transform:translateX(-50%);max-width:82vw;text-align:center;
  background:rgba(0,0,0,0.62);color:#e8e4dc;font-size:clamp(12px,3.4vw,17px);padding:10px 16px;
  z-index:40;opacity:0;transition:opacity 0.4s;pointer-events:none;line-height:1.5;}
#subs{position:fixed;bottom:20%;left:50%;transform:translateX(-50%);max-width:86vw;text-align:center;
  color:#fff;font-size:clamp(12px,3.6vw,18px);z-index:40;opacity:0;transition:opacity 0.35s;
  pointer-events:none;text-shadow:0 2px 10px #000;line-height:1.5;}
#subs b{color:#ffcf8a;font-weight:normal;}
#prompt{position:fixed;bottom:34%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.85);
  font-size:clamp(11px,3vw,15px);letter-spacing:2px;z-index:40;opacity:0;transition:opacity 0.2s;
  pointer-events:none;text-shadow:0 2px 8px #000;}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;
  border-radius:50%;background:rgba(255,255,255,0.5);z-index:30;pointer-events:none;}

/* ---------- управление ---------- */
#jzone{position:fixed;left:18px;bottom:18px;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.13);z-index:25;}
#jknob{position:absolute;left:38px;top:38px;width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.3);}
.btn{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,0.07);
  border:2px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.8);z-index:25;
  display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;
  font-size:13px;letter-spacing:1px;}
#brun{right:118px;bottom:118px;} #bcrouch{right:24px;bottom:118px;}
#bjump{right:24px;bottom:24px;} #bact{right:118px;bottom:24px;background:rgba(120,100,20,0.5);}
.btn.pressed{border-color:#ffd700;color:#ffd700;}

/* ---------- эффекты ---------- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 78% 78% at 50% 50%,rgba(0,0,0,0) 44%,rgba(0,0,0,0.5) 80%,rgba(0,0,0,0.88) 100%);}
#grain{position:fixed;inset:-60px;pointer-events:none;z-index:6;opacity:0.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  animation:gr 0.5s steps(4) infinite;}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-14px,8px)}50%{transform:translate(9px,-11px)}75%{transform:translate(-7px,-6px)}100%{transform:translate(11px,5px)}}
/* сон: мягкая дымка и лёгкое дыхание кадра */
#dream{position:fixed;inset:0;pointer-events:none;z-index:7;
  background:radial-gradient(ellipse 60% 60% at 50% 45%,rgba(255,240,220,0.10) 0%,rgba(255,225,200,0.02) 45%,rgba(0,0,0,0) 70%);
  animation:br 7s ease-in-out infinite;}
@keyframes br{0%,100%{opacity:0.85;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity 0.25s;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,rgba(0,0,0,0) 28%,rgba(140,0,0,0.8) 100%);}
#white{position:fixed;inset:0;pointer-events:none;z-index:250;opacity:0;background:#fff;}
#black{position:fixed;inset:0;pointer-events:none;z-index:249;opacity:0;background:#000;
  transition:opacity 0.6s;}

#inv{display:none;position:fixed;left:16px;top:14px;z-index:30;color:rgba(255,235,190,0.8);
  font-size:12px;letter-spacing:1px;line-height:1.9;text-shadow:0 2px 8px #000;pointer-events:none;}
#bfl{right:212px;bottom:24px;font-size:22px;}
#buv{right:118px;bottom:212px;font-size:22px;background:rgba(90,50,160,0.35);
  border-color:rgba(170,130,255,0.45);}
#buv.pressed{border-color:#c8a8ff;color:#c8a8ff;background:rgba(120,70,220,0.5);}
#brel{right:24px;bottom:212px;font-size:24px;}
#quest{position:fixed;right:0;top:64px;z-index:32;pointer-events:none;
  background:rgba(10,10,14,0.86);border-left:3px solid #c9a227;
  padding:11px 16px 11px 13px;max-width:min(62vw,300px);
  transform:translateX(110%);transition:transform 0.55s cubic-bezier(.2,.9,.3,1),
  border-color 0.4s,opacity 0.5s;opacity:0;}
#quest.show{transform:translateX(0);opacity:1;}
#quest.done{border-left-color:#3fa85f;}
#quest .qt{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.42);margin-bottom:6px;}
#quest .qx{display:flex;align-items:flex-start;gap:9px;}
#quest .qbox{flex:0 0 auto;width:15px;height:15px;border:2px solid rgba(255,255,255,0.35);
  margin-top:1px;position:relative;transition:border-color 0.3s;}
#quest.done .qbox{border-color:#3fa85f;}
#quest.done .qbox:after{content:'';position:absolute;left:3px;top:-1px;width:6px;height:11px;
  border:solid #3fa85f;border-width:0 2.5px 2.5px 0;transform:rotate(42deg);}
#quest .qtxt{font-size:12px;line-height:1.5;color:#e4e0d6;}
#quest.done .qtxt{color:#8a9a88;text-decoration:line-through;}
#quest .qs{font-size:10px;color:rgba(255,255,255,0.4);margin-top:6px;line-height:1.5;}
#uvflash{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;background:#b48cff;}
#uvhud{display:none;position:fixed;left:16px;top:104px;z-index:30;pointer-events:none;
  color:rgba(200,170,255,0.85);font-size:10px;letter-spacing:2px;}
#uvhud .lbl{margin-bottom:4px;color:rgba(255,255,255,0.4);}
#uvhud .row{display:flex;gap:5px;}
#uvhud i{width:11px;height:22px;border-radius:3px;border:1px solid rgba(170,130,255,0.35);
  background:rgba(60,40,100,0.35);display:block;}
#uvhud i.ok{background:#8a5cff;box-shadow:0 0 8px #8a5cff;}
#uvhud .sp{margin-top:5px;color:rgba(255,255,255,0.45);}
#uv-inspect-btn{display:none;position:fixed;left:16px;top:150px;z-index:30;
  font-size:10px;letter-spacing:2px;color:rgba(200,170,255,0.85);
  border:1px solid rgba(170,130,255,0.4);border-radius:4px;padding:5px 9px;
  background:rgba(20,10,35,0.5);cursor:pointer;user-select:none;}
#uv-inspect-btn:hover{border-color:#c86bff;color:#e8d8ff;}
#uv-inspect-btn.on{background:rgba(120,60,200,0.5);border-color:#c86bff;}
#batwrap{display:none;position:fixed;left:16px;top:52px;z-index:30;pointer-events:none;}
#fl2-inspect-btn{display:none;position:fixed;left:16px;top:80px;z-index:30;
  font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.75);
  border:1px solid rgba(255,255,255,0.3);border-radius:4px;padding:5px 9px;
  background:rgba(20,20,20,0.5);cursor:pointer;user-select:none;}
#fl2-inspect-btn:hover{border-color:#fff;color:#fff;}
#fl2-inspect-btn.on{background:rgba(90,90,90,0.5);border-color:#fff;}
#batlbl{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.4);margin-bottom:3px;}
#batbar{width:120px;height:8px;background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);}
#batfill{height:100%;width:100%;background:#4ac06a;transition:width 0.3s,background 0.4s;}
#vibwrap{display:none;position:fixed;bottom:156px;left:50%;transform:translateX(-50%);z-index:20;
  pointer-events:none;text-align:center;}
#viblbl{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.42);margin-bottom:4px;}
#vibbar{width:min(46vw,220px);height:9px;background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.16);}
#vibfill{height:100%;width:0%;background:#3a7a4a;transition:width 0.1s linear,background 0.25s;}
#heatw{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:22;opacity:0;
  transition:opacity 0.3s;pointer-events:none;color:#ff7a4a;font-size:12px;letter-spacing:4px;
  text-shadow:0 0 12px rgba(255,60,20,0.7);}
#wires{display:none;position:fixed;inset:0;z-index:165;background:rgba(6,7,5,0.96);
  flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#wpround{color:#d8d4cc;font-size:13px;letter-spacing:6px;}
#wphint{color:#9a958a;font-size:13px;letter-spacing:2px;height:20px;text-align:center;padding:0 16px;}
#wpcols{display:flex;align-items:center;gap:min(16vw,90px);}
#wpleft,#wpright{display:flex;flex-direction:column;gap:14px;}
#wpmid{width:2px;height:230px;background:rgba(255,255,255,0.10);}
.wire{width:54px;height:34px;border-radius:6px;border:2px solid rgba(255,255,255,0.28);
  cursor:pointer;transition:transform 0.12s,opacity 0.2s;}
.wire.sel{transform:scale(1.16);border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,0.6);}
.wire.done{opacity:0.25;border-color:rgba(255,255,255,0.12);cursor:default;}
#wires.bad #wpcols{animation:wsh 0.26s;}
@keyframes wsh{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#mapov{display:none;position:fixed;inset:0;z-index:170;background:rgba(4,4,6,0.96);
  flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#mapcv{width:min(78vw,420px);height:min(78vw,420px);}
#mapmsg{color:#d8d4cc;font-size:13px;letter-spacing:4px;height:18px;}
#keypad{display:none;position:fixed;inset:0;z-index:160;background:rgba(4,4,6,0.94);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#kptitle{color:#d8d4cc;font-size:14px;letter-spacing:6px;}
#kpdisp{color:#ffcf8a;font-size:34px;letter-spacing:10px;font-family:'Courier New',monospace;height:42px;}
#kpgrid{display:grid;grid-template-columns:repeat(3,74px);gap:11px;}
#kpgrid button{width:74px;height:64px;background:#14141c;color:#e8e4dc;
  border:2px solid rgba(255,255,255,0.22);font-family:'Courier New',monospace;font-size:22px;cursor:pointer;}
#kpgrid button:active{background:#ffcf8a;color:#111;}
#kpclose{background:none;color:#5a5560;border:none;font-family:'Courier New',monospace;
  font-size:11px;letter-spacing:3px;cursor:pointer;padding:10px;}
/* ---------- экран загрузки ---------- */
#load{position:fixed;inset:0;background:#060607;z-index:280;display:none;}
#loadcv{position:absolute;right:8%;top:50%;transform:translateY(-50%);width:min(46vw,340px);
  height:min(46vw,340px);}
#loadtxt{position:absolute;left:26px;bottom:24px;color:#8a8590;font-size:13px;letter-spacing:6px;}
#loadtxt i{font-style:normal;opacity:0;animation:dot 1.4s infinite;}
#loadtxt i:nth-child(2){animation-delay:0.2s}#loadtxt i:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,60%,100%{opacity:0}30%{opacity:1}}
#loadtip{position:absolute;left:26px;bottom:64px;color:#4a4650;font-size:11px;letter-spacing:2px;
  max-width:60vw;line-height:1.8;}
#loadbar{position:absolute;left:26px;bottom:12px;width:200px;height:2px;background:rgba(255,255,255,0.08);}
#loadfill{height:100%;width:0%;background:#8a8590;}

/* ---------- конец ---------- */
#endscreen{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:290;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
#endtitle{color:#c02020;font-size:clamp(22px,7vw,40px);letter-spacing:8px;margin-bottom:12px;}
#endsub{color:#8a8590;font-size:13px;letter-spacing:2px;margin-bottom:26px;}
#endscreen button{background:#12121a;color:#c02020;border:2px solid rgba(192,32,32,0.5);
  padding:14px 34px;font-family:'Courier New',monospace;font-size:14px;letter-spacing:4px;cursor:pointer;}
</style>
</head>
<body>
<div id="renderer"></div>
<div id="vig"></div><div id="grain"></div><div id="dream"></div><div id="dmg"></div>
<div id="crosshair"></div>
<div id="msg"></div><div id="subs"></div><div id="prompt"></div>

<div id="jzone"><div id="jknob"></div></div>
<div class="btn" id="brun">БЕГ</div>
<div class="btn" id="bcrouch">СЕСТЬ</div>
<div class="btn" id="bjump">ПРЫЖОК</div>
<div class="btn" id="bact">E</div>
<div class="btn" id="bfl" style="display:none">🔦</div>
<div class="btn" id="buv" style="display:none">🔫</div>
<div class="btn" id="brel" style="display:none">⟳</div>

<div id="inv"></div>
<div id="quest"></div>
<div id="choice"></div>
<div id="savedmsg"></div>
<div id="uvflash"></div>
<div id="uvhud"></div>
<div id="uv-inspect-btn" class="touchui" onclick="uvInspectToggle()">👁 ОСМОТР</div>
<div id="batwrap"><div id="batlbl">ЗАРЯД</div><div id="batbar"><div id="batfill"></div></div></div>
<div id="fl2-inspect-btn" class="touchui" onclick="fl2InspectToggle()">👁 ОСМОТР</div>
<div id="vibwrap">
  <div id="viblbl">ВИБРАЦИЯ ПОЛА</div>
  <div id="vibbar"><div id="vibfill"></div></div>
</div>
<div id="heatw">ОН ЧУВСТВУЕТ ТЕПЛО</div>
<div id="wires">
  <div id="wpround"></div>
  <div id="wpcols"><div id="wpleft"></div><div id="wpmid"></div><div id="wpright"></div></div>
  <div id="wphint"></div>
</div>
<div id="mapov">
  <canvas id="mapcv" width="420" height="420"></canvas>
  <div id="mapmsg"></div>
</div>
<div id="keypad">
  <div id="kptitle">СЕЙФ</div>
  <div id="kpdisp">_ _ _ _</div>
  <div id="kpgrid"></div>
  <button id="kpclose" onclick="closeKeypad()">ОТОЙТИ</button>
</div>
<div id="titlecard" style="display:none"></div>
<div id="black"></div><div id="white"></div>

<div id="load">
  <canvas id="loadcv" width="340" height="340"></canvas>
  <div id="loadtip"></div>
  <div id="loadtxt">ЗАГРУЗКА<i>.</i><i>.</i><i>.</i></div>
  <div id="loadbar"><div id="loadfill"></div></div>
</div>

<div id="start">
  <div id="menubg"></div>
  <div id="menuwrap">
    <h1>ЗАБРОШЕННЫЙ МАГАЗИН</h1>
    <div class="sub">Ч А С Т Ь &nbsp; I I</div>
    <button class="mbtn" onclick="menuNewGame()">НОВАЯ ИГРА</button>
    <button class="mbtn ghost" id="mcont" onclick="menuContinue()" disabled>ПРОДОЛЖИТЬ</button>
    <div id="mhint">Сохранение появится на первом складе</div>
    <div id="mnote"></div>
    <div class="rows">
      <div class="row"><b>Джойстик слева</b> — движение</div>
      <div class="row"><b>Свайп по экрану</b> — камера</div>
      <div class="row"><b>Кнопки справа</b> — бег / присесть / прыжок / действие</div>
    </div>
  </div>
</div>

<div id="endscreen">
  <div id="endtitle">ВЫ ПОГИБЛИ</div>
  <div id="endsub"></div>
  <button id="bload" onclick="loadSave()" style="display:none">ПРОДОЛЖИТЬ С СОХРАНЕНИЯ</button>
  <div id="bloadlbl"></div>
  <button onclick="restartGame()">НАЧАТЬ ЗАНОВО</button>
</div>

<!-- three.js теперь из npm (см. web/package.json), не из vendor-файла.
     Мост (entry-part2.js) — модуль, значит откладывается до конца
     парсинга; игровой код (part2-game.js) остался классическим
     скриптом, но с defer — тот же порядок отложенного выполнения,
     поэтому window.THREE успевает появиться первым. -->
<script type="module" src="/src/entry-part2.js"></script>
<script src="/legacy/part2-game.js" defer></script>
</body>
</html>
