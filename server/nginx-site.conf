# nginx ВНУТРИ контейнера magazin-web.
# Главное правило кэширования:
#   version.json и sw.js  — никогда не кэшировать, иначе игрок
#                            навсегда останется на старой сборке;
#   html                   — не кэшировать (свежесть важнее);
#   картинки, js, three.js — кэшировать надолго, они меняются
#                            вместе со сборкой и подтягиваются service worker'ом.
server {
    listen 80;
    server_name _;
    # /srv/www — ссылка на папку текущей версии. nginx разбирает её
    # на каждом запросе, поэтому новая выкладка подхватывается сразу.
    root /srv/www;
    index index.html;
    disable_symlinks off;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Три.js и прочее большое отдаём с диска крупными кусками
    sendfile on;
    tcp_nopush on;

    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        default_type application/javascript;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # legacy/*.js — стабильные имена файлов (part1-game.js, part2-game.js),
    # содержимое которых меняется при каждой выкладке, а имя — нет.
    # Обычный HTTP-кэш браузера держал бы старую версию неделю (см. правило
    # ниже) даже после сброса Service Worker (?nosw=1) — тот чистит только
    # свой Cache Storage, а не встроенный кэш браузера. Поэтому здесь
    # принудительная ревалидация на каждый запрос (браузер всё равно почти
    # всегда получит быстрый 304, если файл не изменился).
    location ~* ^/legacy/.*\.js$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|mp3|ogg)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файл для скачивания приложения на Android
    location = /magazin.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="magazin.apk"' always;
        add_header Cache-Control "no-cache" always;
    }

    access_log /var/log/nginx/magazin.access.log;
    error_log  /var/log/nginx/magazin.error.log warn;
}
