# nginx ХОСТА → /etc/nginx/sites-available/magazin
# Отдельный файл, отдельный server_name. Конфиги chesscoin, jobtop
# и default этим не затрагиваются: nginx выбирает блок по имени домена,
# а имя здесь своё.
#
# Порт 443 добавит certbot при выпуске сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name magazin.45-67-216-36.sslip.io;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
