# → /etc/nginx/conf.d/magazin-upgrade-map.conf
#
# Отдельный файл в conf.d, потому что map можно объявить только
# в общем блоке http, а туда лезть правкой чужих конфигов нельзя.
# Здесь ровно одна переменная, и имя у неё своё.
#
# Нужна для WebSocket: обычный запрос идёт с Connection: close,
# а тот, что просится в постоянное соединение, — с Connection: upgrade.
# Пригодится на этапе нескольких игроков; сейчас просто не мешает.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
